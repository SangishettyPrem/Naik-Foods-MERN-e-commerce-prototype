services:
  - type: web
    name: naikfoods-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: FREE_DELIVERY_THRESHOLD
        value: 999
      - key: STANDARD_SHIPPING_FEE
        value: 79
